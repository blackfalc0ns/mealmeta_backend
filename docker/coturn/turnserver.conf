# ==============================================================================
# MealMate VoIP In-App Calling - Production Coturn Configuration
# ==============================================================================
# WebRTC STUN/TURN server configuration for NAT traversal and audio media relay.
# Uses ephemeral credentials signed via HMAC-SHA1 shared secret (TURN REST API).
# ==============================================================================

# STUN/TURN listening ports
listening-port=3478
tls-listening-port=5349
alt-listening-port=0
alt-tls-listening-port=0

# Realm and Authentication
realm=turn.mealmate.app
use-auth-secret
# Replace with the value of Coturn:SharedSecret or COTURN_SHARED_SECRET
static-auth-secret=mealmate_coturn_secret_key_change_in_production

# WebRTC Fingerprint requirement (RFC 5389 / RFC 5766)
fingerprint

# Ephemeral nonce expiration time in seconds (RFC 5766 recommendation: 600s)
stale-nonce=600

# UDP Relay Port Range for WebRTC media streams
min-port=49152
max-port=65535

# Security hardening: Prevent relaying to internal/loopback/multicast network addresses
no-multicast-peers
no-loopback-peers

# Disable administrative command-line interface
no-cli

# TLS / DTLS Certificates (Mount into /etc/coturn/certs/ in production)
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem

# Logging Configuration
verbose
log-file=stdout
simple-log
