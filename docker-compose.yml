services:
  postgres:
    # Plain Postgres 16 on 5433 to avoid clashing with any local Postgres on 5432.
    # PostGIS can be swapped in later when geo columns are needed.
    image: postgres:16-alpine
    container_name: mealmate-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mealmate
    volumes:
      - mealmate_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mealmate"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mealmate_pgdata:
