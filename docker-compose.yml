services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: mealmate-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mealmate
    volumes:
      - mealmate_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mealmate"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mealmate_pgdata:
