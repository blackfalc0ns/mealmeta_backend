name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mealmate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mealmate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ASPNETCORE_ENVIRONMENT: Testing
      ConnectionStrings__MealMateDb: Host=localhost;Port=5432;Database=mealmate_test;Username=postgres;Password=postgres
      Jwt__SecretKey: TEST_ONLY_mealmate_ci_jwt_secret_key_32chars_min
      Jwt__Issuer: https://api.mealmate.test
      Jwt__Audience: mealmate-clients
      Seed__Identity: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python for family release gates
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Verify family release gate checks
        run: |
          python scripts/check-family-release.py --self-test
          python scripts/check-family-release.py

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore

      - name: Format check
        continue-on-error: true
        run: dotnet format --verify-no-changes --verbosity diagnostic

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Build family-flow report-only reconciliation tool
        run: dotnet build tools/FamilyFlowReconciliation/FamilyFlowReconciliation.csproj --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test --no-build --configuration Release
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
          --logger "trx;LogFileName=test-results.trx"

      - name: Install EF tools
        run: dotnet tool install --global dotnet-ef --version 9.0.*

      - name: Verify EF migrations are up to date
        run: >
          dotnet ef migrations has-pending-model-changes
          --project src/MealMate.Persistence
          --startup-project src/MealMate.Api

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults/**
          retention-days: 14

  gitleaks:
    name: Secret scan
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Scan for secrets
        run: gitleaks detect --source . --verbose --redact --exit-code 1
