name: Build and deploy API to MonsterASP

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-monsterasp-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Publish and deploy API
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.*.props', 'src/**/*.csproj', '**/NuGet.Config', '**/nuget.config') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore API dependencies
        run: |
          dotnet restore src/MealMate.Api/MealMate.Api.csproj
          if ($LASTEXITCODE -ne 0) { throw 'API restore failed.' }

      - name: Publish API
        run: |
          dotnet publish src/MealMate.Api/MealMate.Api.csproj --configuration Release --output ./publish --no-restore --nologo -p:DebugType=None -p:DebugSymbols=false
          if ($LASTEXITCODE -ne 0) { throw 'API publish failed.' }
          if (-not (Test-Path ./publish/MealMate.Api.dll)) { throw 'API assembly is missing.' }

      - name: Deploy API over SFTP
        timeout-minutes: 10
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          FTP_HOST_KEY: ${{ secrets.FTP_HOST_KEY }}
          WEBSITE_NAME: ${{ secrets.WEBSITE_NAME }}
          SERVER_COMPUTER_NAME: ${{ secrets.SERVER_COMPUTER_NAME }}
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: ./scripts/deploy-monsterasp.ps1 -PublishPath ./publish
