name: Build and deploy API to MonsterASP

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: backend-monsterasp-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify API and PostgreSQL subscription flow
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore MealMate.sln

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Build
        run: dotnet build MealMate.sln --configuration Release --no-restore --nologo

      - name: Unit tests
        run: dotnet test tests/MealMate.UnitTests/MealMate.UnitTests.csproj --configuration Release --no-build --no-restore --nologo

      - name: API tests
        run: dotnet test tests/MealMate.ApiTests/MealMate.ApiTests.csproj --configuration Release --no-build --no-restore --nologo

      - name: PostgreSQL integration tests
        run: dotnet test tests/MealMate.IntegrationTests/MealMate.IntegrationTests.csproj --configuration Release --no-build --no-restore --nologo

      - name: Verify EF model is migrated
        run: dotnet ef migrations has-pending-model-changes --project src/MealMate.Persistence --startup-project src/MealMate.Api --configuration Release --no-build --no-color

  build-and-deploy:
    name: Build and deploy API (FTPS)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Prefer FTP_* secrets; fall back to existing WebDeploy secrets.
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
      WEBSITE_NAME: ${{ secrets.WEBSITE_NAME }}
      SERVER_COMPUTER_NAME: ${{ secrets.SERVER_COMPUTER_NAME }}
      SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
      SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve FTP settings
        id: ftp
        run: |
          set -euo pipefail

          resolve_ftp_server() {
            if [ -n "${FTP_SERVER:-}" ]; then
              printf '%s' "$FTP_SERVER"
              return 0
            fi
            if [ -n "${SERVER_COMPUTER_NAME:-}" ]; then
              host="${SERVER_COMPUTER_NAME#https://}"
              host="${host#http://}"
              host="${host%%/*}"
              host="${host%%:*}"
              if [ -n "$host" ]; then
                printf '%s' "$host"
                return 0
              fi
            fi
            if [ -n "${WEBSITE_NAME:-}" ]; then
              printf '%s' "${WEBSITE_NAME}.siteasp.net"
              return 0
            fi
            return 1
          }

          server="$(resolve_ftp_server || true)"
          if [ -z "$server" ]; then
            echo "::error::Could not resolve FTP host. Set FTP_SERVER or keep SERVER_COMPUTER_NAME/WEBSITE_NAME WebDeploy secrets."
            exit 1
          fi

          user="${FTP_USERNAME:-${SERVER_USERNAME:-${WEBSITE_NAME:-}}}"
          pass="${FTP_PASSWORD:-${SERVER_PASSWORD:-}}"
          dir="${FTP_SERVER_DIR:-/wwwroot/}"
          if [ -z "$user" ] || [ -z "$pass" ]; then
            echo "::error::Missing FTP credentials. Set FTP_USERNAME/FTP_PASSWORD (or SERVER_USERNAME/SERVER_PASSWORD)."
            exit 1
          fi
          case "$dir" in
            */) ;;
            *) dir="${dir}/" ;;
          esac
          {
            echo "server=$server"
            echo "username=$user"
            echo "server_dir=$dir"
          } >> "$GITHUB_OUTPUT"
          echo "FTP_EFFECTIVE_SERVER=$server" >> "$GITHUB_ENV"
          echo "FTP_EFFECTIVE_USERNAME=$user" >> "$GITHUB_ENV"
          echo "FTP_EFFECTIVE_PASSWORD=$pass" >> "$GITHUB_ENV"
          echo "FTP_EFFECTIVE_DIR=$dir" >> "$GITHUB_ENV"
          echo "Using FTPS host=$server dir=$dir user=$user"

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore MealMate.sln

      - name: Build
        run: dotnet build MealMate.sln --configuration Release --no-restore --nologo

      - name: Publish API
        run: >
          dotnet publish src/MealMate.Api/MealMate.Api.csproj
          --configuration Release
          --output ./publish
          --no-restore

      # IIS locks running DLLs; app_offline.htm stops the site before file replace.
      - name: Stage app_offline.htm
        run: |
          mkdir -p ./ftp-app-offline
          printf '%s\n' '<!doctype html><title>Updating</title><p>MealMate API is updating. Please retry shortly.</p>' > ./ftp-app-offline/app_offline.htm

      - name: Stop site (upload app_offline.htm)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp.outputs.server }}
          username: ${{ steps.ftp.outputs.username }}
          password: ${{ env.FTP_EFFECTIVE_PASSWORD }}
          protocol: ftps
          local-dir: ./ftp-app-offline/
          server-dir: ${{ steps.ftp.outputs.server_dir }}
          dangerous-clean-slate: false
          log-level: minimal

      - name: Wait for IIS to release file locks
        run: sleep 25

      - name: Deploy to MonsterASP via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp.outputs.server }}
          username: ${{ steps.ftp.outputs.username }}
          password: ${{ env.FTP_EFFECTIVE_PASSWORD }}
          protocol: ftps
          local-dir: ./publish/
          server-dir: ${{ steps.ftp.outputs.server_dir }}
          dangerous-clean-slate: false
          log-level: standard
          exclude: |
            **/*.pdb
            **/app_offline.htm

      - name: Start site (remove app_offline.htm)
        run: |
          python3 - <<'PY'
          import os
          from ftplib import FTP_TLS, error_perm

          host = os.environ["FTP_EFFECTIVE_SERVER"]
          user = os.environ["FTP_EFFECTIVE_USERNAME"]
          password = os.environ["FTP_EFFECTIVE_PASSWORD"]
          directory = os.environ["FTP_EFFECTIVE_DIR"].strip().strip("/")
          remote = f"{directory}/app_offline.htm" if directory else "app_offline.htm"

          ftp = FTP_TLS()
          ftp.connect(host, 21, timeout=60)
          ftp.login(user, password)
          ftp.prot_p()
          try:
              ftp.delete(remote)
              print(f"Removed {remote}")
          except error_perm as exc:
              # Site may already be online if upload overwrote/removed it.
              print(f"Could not remove {remote}: {exc}")
          finally:
              ftp.quit()
          PY
