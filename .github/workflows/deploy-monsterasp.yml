name: Build and deploy API to MonsterASP

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: backend-monsterasp-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify API and PostgreSQL subscription flow
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore MealMate.sln

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Build
        run: dotnet build MealMate.sln --configuration Release --no-restore --nologo

      - name: Unit tests
        run: dotnet test tests/MealMate.UnitTests/MealMate.UnitTests.csproj --configuration Release --no-build --no-restore --nologo

      - name: API tests
        run: dotnet test tests/MealMate.ApiTests/MealMate.ApiTests.csproj --configuration Release --no-build --no-restore --nologo

      - name: PostgreSQL integration tests
        run: dotnet test tests/MealMate.IntegrationTests/MealMate.IntegrationTests.csproj --configuration Release --no-build --no-restore --nologo

      - name: Verify EF model is migrated
        run: dotnet ef migrations has-pending-model-changes --project src/MealMate.Persistence --startup-project src/MealMate.Api --configuration Release --no-build --no-color

  build-and-deploy:
    name: Build, test and deploy API
    needs: verify
    runs-on: windows-latest
    # Includes slow retries while MonsterASP clears stale WebDeploy slots.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore MealMate.sln

      - name: Build
        run: dotnet build MealMate.sln --configuration Release --no-restore --nologo

      - name: Publish API
        run: >
          dotnet publish src/MealMate.Api/MealMate.Api.csproj
          --configuration Release
          --output ./publish
          --no-restore

      # MonsterASP shared hosting does not support remote AppPool stop/start
      # (simply-web-deploy hangs forever on recycleApp StopAppPool).
      # Use content sync + AppOffline per MonsterASP WebDeploy docs.
      - name: Ensure Web Deploy is installed
        shell: pwsh
        run: |
          $msdeploy = 'C:\Program Files (x86)\IIS\Microsoft Web Deploy V3\msdeploy.exe'
          if (Test-Path $msdeploy) {
            Write-Host 'Web Deploy already installed.'
            exit 0
          }
          Write-Host 'Installing Web Deploy via Chocolatey...'
          choco install webdeploy -y --no-progress
          if (-not (Test-Path $msdeploy)) {
            throw "msdeploy.exe not found after install: $msdeploy"
          }

      - name: Deploy to MonsterASP via WebDeploy
        shell: pwsh
        env:
          WEBSITE_NAME: ${{ secrets.WEBSITE_NAME }}
          SERVER_COMPUTER_NAME: ${{ secrets.SERVER_COMPUTER_NAME }}
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $msdeploy = 'C:\Program Files (x86)\IIS\Microsoft Web Deploy V3\msdeploy.exe'
          if (-not (Test-Path $msdeploy)) {
            throw "msdeploy.exe not found at $msdeploy"
          }

          $site = $env:WEBSITE_NAME
          $user = $env:SERVER_USERNAME
          $pass = $env:SERVER_PASSWORD
          $computerName = $env:SERVER_COMPUTER_NAME
          if ([string]::IsNullOrWhiteSpace($site) -or
              [string]::IsNullOrWhiteSpace($computerName) -or
              [string]::IsNullOrWhiteSpace($user) -or
              [string]::IsNullOrWhiteSpace($pass)) {
            throw 'Missing WebDeploy secrets (WEBSITE_NAME, SERVER_COMPUTER_NAME, SERVER_USERNAME, SERVER_PASSWORD).'
          }

          # Accept either base host (simply-web-deploy style) or full MonsterASP publish URL.
          if ($computerName -notmatch '(?i)msdeploy\.axd') {
            $computerName = "$computerName/msdeploy.axd?site=$site"
          }

          $sourcePath = (Resolve-Path './publish').Path
          Write-Host "Deploying '$sourcePath' -> site '$site'"
          Write-Host "computerName=$computerName"

          $dest =
            "contentPath=$site," +
            "computerName=$computerName," +
            "userName=$user," +
            "password=$pass," +
            "authtype=Basic," +
            "includeAcls=False"

          # Shared hosting allows very few concurrent WebDeploy connections (often ~3).
          # Cancelled/hung runners leave slots occupied until the host times them out.
          # Fast msdeploy -retryAttempts makes this worse; use slow outer retries instead.
          $maxAttempts = 8
          $waitSeconds = 90
          Write-Host "Waiting ${waitSeconds}s for any stale WebDeploy connections to clear..."
          Start-Sleep -Seconds $waitSeconds

          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "=== WebDeploy attempt $attempt / $maxAttempts ==="
            $output = & $msdeploy `
              -verb:sync `
              "-source:contentPath=$sourcePath" `
              "-dest:$dest" `
              -allowUntrusted `
              -disableLink:AppPoolExtension `
              -disableLink:ContentExtension `
              -disableLink:CertificateExtension `
              -enableRule:AppOffline `
              -enableRule:DoNotDeleteRule `
              -retryAttempts:1 `
              -verbose `
              2>&1 | ForEach-Object { "$_" }

            $output | ForEach-Object { Write-Host $_ }
            $exitCode = $LASTEXITCODE

            if ($exitCode -eq 0) {
              Write-Host 'Deploy completed successfully.'
              exit 0
            }

            $joined = ($output -join "`n")
            $isConnLimit = $joined -match 'ERROR_EXCEEDED_MAX_SITE_CONNECTIONS'
            if (-not $isConnLimit -or $attempt -eq $maxAttempts) {
              throw "msdeploy failed with exit code $exitCode"
            }

            Write-Host "Site connection limit hit. Waiting ${waitSeconds}s before retry..."
            Start-Sleep -Seconds $waitSeconds
          }
